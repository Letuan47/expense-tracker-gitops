apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: expense-tracker-ingress
  labels:
    app.kubernetes.io/part-of: expense-tracker
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - staging.quanlichitieu.tuanstark.id.vn
      secretName: staging-expense-tracker-tls
  rules:
    - host: staging.quanlichitieu.tuanstark.id.vn
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: expense-tracker-api
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: expense-tracker-web
                port:
                  name: http
