apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: expense-tracker-zero-trust
  labels:
    app.kubernetes.io/part-of: expense-tracker
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    # Allow traffic from Traefik Ingress Controller in kube-system
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 3000
        - protocol: TCP
          port: 8080
