apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: expense-tracker-staging
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Least-Privilege GitOps AppProject for Expense Tracker Staging
  sourceRepos:
    - "https://github.com/TuanStark/expense-tracker-gitops.git"
    - "git@github.com:TuanStark/expense-tracker-gitops.git"
  destinations:
    - namespace: expense-tracker-staging
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: Secret
    - group: ""
      kind: Service
    - group: apps
      kind: Deployment
    - group: batch
      kind: Job
    - group: networking.k8s.io
      kind: Ingress
    - group: networking.k8s.io
      kind: NetworkPolicy
