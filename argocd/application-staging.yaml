apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: expense-tracker-staging
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: expense-tracker-staging
  source:
    repoURL: "https://github.com/TuanStark/expense-tracker-gitops.git"
    targetRevision: main
    path: overlays/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: expense-tracker-staging
  syncPolicy:
    # Start with manual or automated sync; selfHeal prevents manual kubectl drift
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 2
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 1m
