---
# ==============================================================================
# Master Playbook: Day-0 / Day-1 Host Hardening, K3s & ArgoCD GitOps Hand-off
# Usage:
#   ansible-playbook -i inventories/staging/hosts.ini playbooks/site.yml --ask-vault-pass
# Dry-run / Drift Check:
#   ansible-playbook -i inventories/staging/hosts.ini playbooks/site.yml --check --diff
# ==============================================================================

- name: "Phase 1 — OS Security Hardening, Firewall & Kernel Preparation"
  hosts: k3s_cluster
  become: true
  gather_facts: true
  roles:
    - role: os_hardening
      tags: ["os", "security", "firewall"]
    - role: k8s_node_prep
      tags: ["os", "swap", "sysctl"]

- name: "Phase 2 — K3s Control Plane & ArgoCD GitOps Bootstrap"
  hosts: k3s_server
  become: true
  gather_facts: true
  roles:
    - role: k3s_server
      tags: ["k3s"]
    - role: argocd_bootstrap
      tags: ["argocd", "gitops", "ksops"]
