---
- name: Ensure /etc/rancher/k3s directory exists
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Render K3s Server configuration (/etc/rancher/k3s/config.yaml)
  ansible.builtin.template:
    src: k3s-config.yaml.j2
    dest: "{{ k3s_config_file }}"
    owner: root
    group: root
    mode: "0600"
  notify: Restart k3s

- name: Check if K3s binary is already installed
  ansible.builtin.stat:
    path: /usr/local/bin/k3s
  register: k3s_binary

- name: Check installed K3s version if present
  ansible.builtin.command:
    cmd: /usr/local/bin/k3s --version
  register: k3s_installed_version
  changed_when: false
  failed_when: false
  when: k3s_binary.stat.exists

- name: Download official K3s install script
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: /usr/local/bin/k3s-install.sh
    owner: root
    group: root
    mode: "0700"
  when: (not k3s_binary.stat.exists) or (k3s_version not in (k3s_installed_version.stdout | default('')))

- name: Install or upgrade K3s Server to pinned version ({{ k3s_version }})
  ansible.builtin.command:
    cmd: /usr/local/bin/k3s-install.sh
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
    INSTALL_K3S_EXEC: "server"
  when: (not k3s_binary.stat.exists) or (k3s_version not in (k3s_installed_version.stdout | default('')))
  changed_when: true

- name: Ensure k3s systemd service is enabled and running
  ansible.builtin.systemd:
    name: k3s
    enabled: true
    state: started

- name: Wait for K3s Node to report Ready status
  ansible.builtin.command:
    cmd: k3s kubectl wait --for=condition=Ready node --all --timeout=120s
  changed_when: false
