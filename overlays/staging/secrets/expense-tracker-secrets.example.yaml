# TEMPLATE ONLY — DO NOT COMMIT REAL PLAINTEXT CREDENTIALS
# Usage:
# 1. Copy this file to overlays/staging/secrets/expense-tracker-secrets.enc.yaml
# 2. Fill in staging values locally
# 3. Encrypt in-place with SOPS + age BEFORE git add:
#    sops --encrypt --in-place overlays/staging/secrets/expense-tracker-secrets.enc.yaml
apiVersion: v1
kind: Secret
metadata:
  name: expense-tracker-secrets
type: Opaque
stringData:
  # Pooled connection string for NestJS Backend Pod (append &pgbouncer=true if using PgBouncer)
  DATABASE_URL: "postgresql://db_user:CHANGE_ME@db-host.example.com:5432/expense_tracker_staging?schema=public&sslmode=require&connection_limit=10&pool_timeout=15"
  # Direct connection string (port 5432) for Prisma PreSync Migration Job
  DIRECT_DATABASE_URL: "postgresql://db_user:CHANGE_ME@db-host.example.com:5432/expense_tracker_staging?schema=public&sslmode=require"
  # Minimum 256-bit random secret unique to Staging
  JWT_SECRET: "CHANGE_ME_WITH_OPENSSL_RAND_BASE64_48"
  # PayOS Sandbox / Test Credentials
  PAYOS_CLIENT_ID: "CHANGE_ME_SANDBOX_CLIENT_ID"
  PAYOS_API_KEY: "CHANGE_ME_SANDBOX_API_KEY"
  PAYOS_CHECKSUM_KEY: "CHANGE_ME_SANDBOX_CHECKSUM_KEY"
